components:
  schemas:
    AcceptInvitation:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        token:
          type: string
          writeOnly: true
      required:
      - password
      - password2
      - token
      - username
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        team_count:
          type: string
          readOnly: true
        employee_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - employee_count
      - id
      - name
      - team_count
    NameEnum:
      enum:
      - free
      - starter
      - professional
      - enterprise
      type: string
      description: |-
        * `free` - Free
        * `starter` - Starter
        * `professional` - Professional
        * `enterprise` - Enterprise
    Organisation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          nullable: true
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        address:
          type: string
        city:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        logo:
          type: string
          format: uri
          nullable: true
        owner:
          type: integer
          readOnly: true
        owner_name:
          type: string
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        current_plan_name:
          type: string
          readOnly: true
        subscription_status:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - current_plan_name
      - email
      - id
      - member_count
      - name
      - owner
      - owner_name
      - slug
      - subscription_status
    PaginatedDepartmentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Department'

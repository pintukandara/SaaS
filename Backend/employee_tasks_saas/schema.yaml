    post:
      operationId: auth_accept_invitation_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInvitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInvitation'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
